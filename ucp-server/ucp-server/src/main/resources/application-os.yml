# ==========================================
# pg 环境配置（公司vpn开发）
# ==========================================
spring:
  datasource:
    dynamic:
      hikari:
        minimum-idle: 5
        maximum-pool-size: 20
        idle-timeout: 300000
        max-lifetime: 1200000
        connection-timeout: 20000
      datasource:
        master:
          url: jdbc:postgresql://127.0.0.1:5432/ucp-ng
          username: ${DB_USERNAME:postgres}
          password: ${DB_PASSWORD:postgres}
          driver-class-name: org.postgresql.Driver


  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:10}
#      password: 123456
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 1000ms

  devtools:
    restart:
      enabled: false
      additional-paths: richuang-module-server/src/main/java
      exclude: static/**,public/**,templates/**
    livereload:
      enabled: false

  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com}
      read-timeout: 120
      chat:
        options:
          model: ${DASHSCOPE_MODEL:qwen3-max}
          temperature: 0.7
          max-tokens: 10240
          enable-thinking: false
      embedding:
        options:
          model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v2}
          dimensions: 1024
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://10.8.0.7:11434}
      read-timeout-seconds: 180    # 自定义属性，会被 @Value 读取
      connect-timeout-seconds: 5
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen3:4b}
          temperature: 0.7
          max-tokens: 4096
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      # 自定义超时配置（单位：秒）。Spring AI 1.1.2 不支持通过标准属性设置 OkHttp 超时，
      # 由 OpenAiTimeoutConfig 读取并应用到底层 RestClient。
      read-timeout-seconds: ${OPENAI_READ_TIMEOUT_SECONDS:120}
      connect-timeout-seconds: ${OPENAI_CONNECT_TIMEOUT_SECONDS:5}
      chat:
        options:
          model: ${OPENAI_MODEL:qwen3.5-35b-a3b}
          temperature: 0.7
          max-tokens: 10240
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-v4}
          dimensions: 1536
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      connect-timeout: 30000
      read-timeout: 60000
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-chat}
          temperature: 0.7
          max-tokens: 4096


# 自定义AI配置（用于业务层）
ai:
  default-provider: ${AI_DEFAULT_PROVIDER:openai}
  default-embedding-provider: ${AI_DEFAULT_EMBEDDING_PROVIDER:openai}

# 向量存储配置（知识库RAG使用）
vector:
  store:
    type: ${VECTOR_STORE_TYPE:pgvector}
    milvus:
      host: ${MILVUS_HOST:192.168.16.128}
      port: ${MILVUS_PORT:19530}
      username: ${MILVUS_USERNAME:root}
      password: ${MILVUS_PASSWORD:}
      databaseName: ${MILVUS_DATABASE:default}
      collectionPrefix: ${MILVUS_COLLECTION_PREFIX:knowledge}
      partitionsNum: 4
    elasticsearch:
      hosts: ${ES_HOSTS:http://localhost:9200}
      username: ${ES_USERNAME:}
      password: ${ES_PASSWORD:}
      indexPrefix: ${ES_INDEX_PREFIX:knowledge}
    pgvector:
      usePrimaryDatasource: false
      host: ${PGVECTOR_HOST:10.8.0.7}
      port: ${PGVECTOR_PORT:5432}
      database: ${PGVECTOR_DATABASE:code-gen}
      username: ${PGVECTOR_USERNAME:postgres}
      password: ${PGVECTOR_PASSWORD:}
      tablePrefix: ${PGVECTOR_TABLE_PREFIX:knowledge}

# 知识库配置
knowledge:
  splitter:
    chunkSize: 1000
    chunkOverlap: 200
  process:
    batchSize: 100
    async:
      corePoolSize: 2
      maxPoolSize: 5
      queueCapacity: 100

# Milvus 向量数据库配置（兼容旧配置）
milvus:
  host: ${MILVUS_HOST:192.168.16.128}
  port: ${MILVUS_PORT:19530}
  username: ${MILVUS_USERNAME:root}
  password: ${MILVUS_PASSWORD:}
  databaseName: ${MILVUS_DATABASE:default}
  collectionPrefix: ${MILVUS_COLLECTION_PREFIX:knowledge_base}

# LangChain4j 配置
langchain4j:
  enabled: true

# 日志
logging:
  level:
    root: info
    com.lingan.ucp: debug
    com.lingan.ucp.**.mapper: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"



# ==========================================
# Nexus 仓库配置
# ==========================================
nexus:
  enabled: ${NEXUS_ENABLED:false}
  # Nexus服务器地址
  url: ${NEXUS_URL:}
  # 认证信息
  username: ${NEXUS_USERNAME:}
  password: ${NEXUS_PASSWORD:}
  # 仓库配置
  repositories:
    maven:
      hosted: ${NEXUS_MAVEN_HOSTED:maven_kw}
      proxy: maven-central
      group: maven-public
    npm:
      hosted: npm-hosted
      proxy: npm-registry
      group: npm-group
    pypi:
      hosted: pypi-hosted
      proxy: pypi-proxy
      group: pypi-group
  # 上传配置
  upload:
    temp-path: ${NEXUS_UPLOAD_TEMP_PATH:temp}
    chunk-size: 50
    timeout: 300
    retry-count: 3

--- #################### os相关配置 ####################

os:
  captcha:
    enable: false # 本地环境，暂时关闭图片验证码，方便登录等接口的测试；
  info:
    version: 1.0.0
    base-package: com.lingan.ucp
  web:
    admin-ui:
      url: http://dashboard.yudao.iocoder.cn # Admin 管理后台 UI 的地址
    admin-api:
      prefix: api
  xss:
    enable: false
    exclude-urls: # 如下两个 url，仅仅是为了演示，去掉配置也没关系
      - ${spring.boot.admin.context-path}/** # 不处理 Spring Boot Admin 的请求
      - ${management.endpoints.web.base-path}/** # 不处理 Actuator 的请求
  security:
    permit-all_urls:
      - /api/mp/open/** # 微信公众号开放平台，微信回调接口，不需要登录
  api-encrypt:
    enable: true # 是否开启 API 加密
    algorithm: AES # 加密算法，支持 AES、RSA 等
    request-key: 52549111389893486934626385991395 # 【AES 案例】请求加密的秘钥，，必须 16、24、32 位
    response-key: 96103715984234343991809655248883 # 【AES 案例】响应加密的秘钥，AES 案例，必须 16、24、32 位
  #    request-key:  # 【RSA 案例】请求解密的私钥
  #    response-key: MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQDh/CHyBcS/zEfVyINVA7+c9Xxl0CPdxPMK1OIjxaLy/7BLfbkoEpI8onQtjuzfpuxCraDem9bu3BMF0pMH95HytI3Vi0kGjaV+WLIalwgc2w37oA2sbsmKzQOP7SDLO5s2QJNAD7kVwd+Q5rqaLu2MO0xVv+0IUJhn83hClC0L5wIDAQAB # 【RSA 案例】响应加密的公钥
  websocket:
    enable: true # websocket的开关
    path: /infra/ws # 路径
    sender-type: local # 消息发送的类型，可选值为 local、redis、rocketmq、kafka、rabbitmq
    sender-rocketmq:
      topic: ${spring.application.name}-websocket # 消息发送的 RocketMQ Topic
      consumer-group: ${spring.application.name}-websocket-consumer # 消息发送的 RocketMQ Consumer Group
    sender-rabbitmq:
      exchange: ${spring.application.name}-websocket-exchange # 消息发送的 RabbitMQ Exchange
      queue: ${spring.application.name}-websocket-queue # 消息发送的 RabbitMQ Queue
    sender-kafka:
      topic: ${spring.application.name}-websocket # 消息发送的 Kafka Topic
      consumer-group: ${spring.application.name}-websocket-consumer # 消息发送的 Kafka Consumer Group
  swagger:
    title: 芋道快速开发平台
    description: 提供管理后台、用户 App 的所有功能
    version: ${yudao.info.version}
    url: ${yudao.web.admin-ui.url}
    email: xingyu4j@vip.qq.com
    license: MIT
    license-url: https://gitee.com/zhijiantianya/ruoyi-vue-pro/blob/master/LICENSE
  codegen:
    base-package: ${yudao.info.base-package}
    db-schemas: ${spring.datasource.dynamic.datasource.master.name}
    front-type: 20 # 前端模版的类型，参见 CodegenFrontTypeEnum 枚举类
    vo-type: 10 # VO 的类型，参见 CodegenVOTypeEnum 枚举类
    delete-batch-enable: true # 是否生成批量删除接口
    unit-test-enable: false # 是否生成单元测试
    import-enable: false # 是否生成 Excel 导入接口
  tenant: # 多租户相关配置项
    enable: false
    ignore-urls:
      - /jmreport/* # 积木报表，无法携带租户编号
    ignore-visit-urls:
      - /api/system/user/profile/**
      - /api/system/auth/**
    ignore-tables:
    ignore-caches:
      - user_role_ids
      - permission_menu_ids
      - oauth_client
      - notify_template
      - mail_account
      - mail_template
      - sms_template
      - iot:device
      - iot:thing_model_list
  sms-code: # 短信验证码相关的配置项
    expire-times: 10m
    send-frequency: 1m
    send-maximum-quantity-per-day: 10
    begin-code: 9999 # 这里配置 9999 的原因是，测试方便。
    end-code: 9999 # 这里配置 9999 的原因是，测试方便。
  trade:
    order:
      pay-expire-time: 2h # 支付的过期时间
      receive-expire-time: 14d # 收货的过期时间
      comment-expire-time: 7d # 评论的过期时间
      status-sync-to-wxa-enable: true # 是否同步订单状态到微信小程序
    express:
      client: kd_100
      kd-niao:
        api-key: ${OS_TRADE_EXPRESS_KD_NIAO_API_KEY:}
        business-id: 1809751
        request-type: 1002 # 免费版 1002；付费版 8001
      kd100:
        key: ${OS_TRADE_EXPRESS_KD100_KEY:}
        customer: E77DF18BE109F454A5CD319E44BF5177
  iot:
    message-bus:
      type: redis # 消息总线的类型

debug: false
