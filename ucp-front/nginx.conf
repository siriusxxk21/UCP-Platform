server {
    listen       80;
    server_name  localhost;

    # 允许大请求体（预签名 URL 直传时不经过 Nginx，此处保底）
    client_max_body_size 2G;

    # 编辑器与嵌套画布按需加载，压缩 JS/CSS，避免首次打开传输完整引擎包。
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml;

    # 独立编辑器必须返回真实资源；缺失时不能回退到主站首页。
    location /nocode-designer/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # 前端打包后的静态文件目录
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # 支持 Vue Router 的 history 模式
        try_files $uri $uri/ /index.html;
    }

    # 代理 API 请求到后端服务
    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 确保后端返回的自定义响应头（如 X-New-Token）能传递给前端
        proxy_pass_header X-New-Token;
    }

    # 代理 WebSocket 连接到后端服务
    location /ws/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 超时配置
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # 代理 yudao 通用 WebSocket 连接到后端服务
    location /infra/ws {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # 错误页面
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
